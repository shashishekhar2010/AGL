name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Compute GitHub Pages base path
        id: pages-base
        shell: bash
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN_BASE }}" ]; then
            BASE_PATH="${{ vars.CUSTOM_DOMAIN_BASE }}"
          elif [ -n "${{ steps.pages.outputs.base_path }}" ]; then
            RAW_BASE="${{ steps.pages.outputs.base_path }}"
            BASE_PATH="${RAW_BASE%/}/"
          else
            BASE_PATH="/"
          fi
          echo "base=${BASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "Resolved VITE_BASE_PATH=${BASE_PATH}"

      - name: Build static website for GitHub Pages
        env:
          VITE_BASE_PATH: ${{ steps.pages-base.outputs.base }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
